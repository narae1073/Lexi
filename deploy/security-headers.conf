# Lexi security headers.
#
# nginx does not merge add_header directives across inheritance levels: as soon
# as a location declares even one add_header, every add_header from the
# enclosing server block is ignored. Include this file in the server block AND
# in every location that declares its own header (Cache-Control and friends).
#
# Installed as: /etc/nginx/snippets/lexi-security-headers.conf
# Source of truth: deploy/security-headers.conf

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://gwsrowpbcqwtpciknayl.supabase.co" always;
