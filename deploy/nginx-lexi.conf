# Lexi — repository copy of /etc/nginx/sites-available/lexi.
#
# This file is the source of truth. The live server is only changed after the
# user explicitly approves a deploy. Do not edit /etc/nginx from this worktree.
#
# Cloudflare sits in front of this origin. It must not cache /sw.js or
# /manifest.webmanifest, otherwise a deploy can stay invisible for hours even
# though nginx sends no-cache. If `node scripts/verify-headers.mjs` reports
# cf-cache-status HIT/STALE for either file, add a Cloudflare Cache Rule:
#   URI Path equals /sw.js               -> Bypass cache
#   URI Path equals /manifest.webmanifest -> Bypass cache
#
# Apply (only with approval):
#   sudo install -m 644 deploy/security-headers.conf /etc/nginx/snippets/lexi-security-headers.conf
#   sudo diff -u /etc/nginx/sites-available/lexi deploy/nginx-lexi.conf
#   # This copy mirrors the documented server block, including both IPv4 and
#   # IPv6 listeners and the port-80 redirect. If the live file has directives
#   # that are not here (for example http2/access_log), merge them before
#   # replacing it.
#   sudo cp /etc/nginx/sites-available/lexi /root/lexi.nginx.bak
#   sudo install -m 644 deploy/nginx-lexi.conf /etc/nginx/sites-available/lexi
#   sudo nginx -t && sudo systemctl reload nginx
#   node scripts/verify-headers.mjs
#
# Rollback:
#   sudo install -m 644 /root/lexi.nginx.bak /etc/nginx/sites-available/lexi
#   sudo nginx -t && sudo systemctl reload nginx
#   node scripts/verify-headers.mjs   # expected to fail until a fixed config is applied again

# Plain HTTP never serves the app. Keep the canonical host in the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name app.achijaser.date;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.achijaser.date;

    ssl_certificate     /etc/ssl/certs/achijaser-origin.pem;
    ssl_certificate_key /etc/ssl/private/achijaser-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;

    root /var/www/lexi;
    index index.html;

    # Inherited by locations that do not declare their own add_header.
    # Every location below that does declare one includes this again, because
    # nginx drops all inherited add_header directives in that case.
    include /etc/nginx/snippets/lexi-security-headers.conf;

    # The app shell must revalidate on every navigation. Vite hashes the
    # filenames it references, so an old shell points at old assets safely.
    location = /index.html {
        include /etc/nginx/snippets/lexi-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The service worker controls when a new deploy becomes active. Serving it
    # with max-age (the previous 14400) delayed deploys by up to four hours.
    location = /sw.js {
        include /etc/nginx/snippets/lexi-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The manifest points at the install metadata; revalidate it with the shell.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/lexi-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Everything under /assets/ is content-hashed by Vite and can be cached for
    # a year. The header snippet must be repeated: without it this location
    # would silently lose CSP/HSTS/XFO because it declares Cache-Control.
    location /assets/ {
        include /etc/nginx/snippets/lexi-security-headers.conf;
        # No `always`: a 404 for a removed hashed asset must not be cached for a
        # year. Security headers above still apply to errors via `always`.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. No add_header here on purpose: this location inherits the
    # server-level headers above. If you ever add a header here, also add the
    # security-headers include, or CSP/HSTS disappear from every SPA route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
